[package]
name = "benches"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Joona Aalto <jondolf.dev@gmail.com>"]
description = "Benchmarks for Avian Physics"
repository = "https://github.com/avianphysics/avian"
readme = "README.md"

[features]
default = ["2d", "3d"]
2d = ["dep:avian2d"]
3d = ["dep:avian3d"]

[dependencies]
# Physics
avian2d = { path = "../crates/avian2d", default-features = false, features = [
    "2d",
    "parry-f32",
    "parallel",
    "simd",
], optional = true }
avian3d = { path = "../crates/avian3d", default-features = false, features = [
    "3d",
    "parry-f32",
    "parallel",
    "simd",
], optional = true }

# Bevy
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false }

# CLI
clap = { version = "4.6", features = ["derive"] }

# Miscellaneous
rayon = { version = "1.12" }

# parry on the branch zero's Cargo.toml patches in.
[patch.crates-io]
parry3d = { git = "https://github.com/Progression-Labs/parry", branch = "aurora" }
parry3d-f64 = { git = "https://github.com/Progression-Labs/parry", branch = "aurora" }
parry2d = { git = "https://github.com/Progression-Labs/parry", branch = "aurora" }
parry2d-f64 = { git = "https://github.com/Progression-Labs/parry", branch = "aurora" }

# The bevy zero builds, as in avian's own workspace (../Cargo.toml): Progression-Labs/bevy on the branch zero's Cargo.toml patches in, so the
# crate's own tests run against the engine the game does (it uses the fork's API, such as
# `Gizmos::set_owner`). Only the crates something outside bevy names are listed; the rest come
# from the fork's own workspace. The branch is copied from zero's
# `[patch."https://github.com/bevyengine/bevy"]` block (Progression-Labs/zero Cargo.toml): when
# zero moves to another bevy branch, these ten lines move with it.
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_app = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_color = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_ecs = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_log = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_math = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_platform = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_reflect = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_shape = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }
bevy_utils = { git = "https://github.com/Progression-Labs/bevy", branch = "claude/bsn-descendant-patch" }

[profile.dev]
# Make the `dev` profile equivalent to the `release` profile
# so that benchmarks are more realistic even without `--release`.
# Reference: https://doc.rust-lang.org/cargo/reference/profiles.html
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
